{% extends "base.html" %}
{% block content %}
<h3>{{ 'Edit event' if ev else 'New event' }}</h3>
<form method="post" action="{{ post_url }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="mb-2"><label class="form-label">Title</label><input class="form-control" name="title" value="{{ d.title }}" required></div>
  <div class="row g-2 mb-2">
    <div class="col-md-6"><label class="form-label">Category</label>
      <select name="category" class="form-select">{% for c in categories %}<option {{ 'selected' if c == d.category }}>{{ c }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label">Venue</label>
      <select name="venue_id" class="form-select">{% for v in venues %}<option value="{{ v.id }}" {{ 'selected' if v.id == d.venue_id }}>{{ v.name }} (capacity {{ v.capacity }})</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label">Start</label><input type="datetime-local" class="form-control" name="start" value="{{ d.start }}" required></div>
    <div class="col-md-6"><label class="form-label">End</label><input type="datetime-local" class="form-control" name="end" value="{{ d.end }}" required></div>
  </div>
  <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3">{{ d.description }}</textarea></div>
  <h6>Ticket categories (at least one; total may not exceed venue capacity)</h6>
  {% for r in d.rows %}{% set i = loop.index %}
  <div class="row g-2 mb-2">
    <input type="hidden" name="cat_id_{{ i }}" value="{{ r.id }}">
    <div class="col-5"><input class="form-control" name="name_{{ i }}" placeholder="Name" value="{{ r.name }}"></div>
    <div class="col-3"><input class="form-control" type="number" step="0.01" min="0" name="price_{{ i }}" placeholder="Price" value="{{ r.price }}"></div>
    <div class="col-4"><input class="form-control" type="number" min="0" name="qty_{{ i }}" placeholder="Quantity" value="{{ r.qty }}"></div>
  </div>
  {% endfor %}
  <button name="action" value="draft" class="btn btn-secondary">Save</button>
  <button name="action" value="publish" class="btn btn-primary">Save &amp; publish</button>
  <a href="/admin/events" class="btn btn-link">Back</a>
</form>
{% endblock %}
